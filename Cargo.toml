[package]
name = "fleet"
version = "0.8.0"
edition = "2021"
default-run = "fleet"

[lib]
name = "fleet"
path = "src/lib.rs"

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
rune = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
