<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet — your agents, one screen</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem('fleet-theme') || 'dark'; } catch (e) {}</script>
<style>
/* hallmark-rune · app: fleet · vernacular: ops board · nav: session rail (the list is the work) · signature: session board · tokens: hr-template v1 (Fleet anchor row) · critique: weakest State coverage — this pass adds the board's loading and connection-error states */
  :root, [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1218; --panel: #141a22; --panel-2: #1a222d; --field: #10151c;
    --ink: #e8edf3; --muted: #94a3b5; --faint: #7e8a9c; --rule: #232c38;
    --accent: #6ea8e1; --accent-hover: #5b97d4; --accent-ink: #0b1522; --accent-bg: #22354d;
    --ok: #4cc38a; --ok-bg: #173d2a; --ok-ink: #08130d;
    --warn: #d99a4e; --warn-bg: #453214;
    --err: #e06c60; --err-bg: #3a1d1a;
    --font-body: "Barlow", "Inter", "Segoe UI", -apple-system, Roboto, "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --text-meta: 11px; --text-label: 12px; --text-small: 13px; --text-dense: 14px;
    --text-body: 15px; --text-title: 18px; --text-screen: 20px; --text-display: 24px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
    --r-control: 6px; --r-card: 8px; --r-panel: 12px; --r-chip: 999px;
    --dur-micro: 120ms; --dur-short: 200ms; --dur-panel: 280ms;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #f4f6f9; --panel: #ffffff; --panel-2: #eef2f7; --field: #f0f3f7;
    --ink: #17222e; --muted: #50637a; --faint: #57687d; --rule: #d8dfe8;
    --accent: #1f66c2; --accent-hover: #1a57a6; --accent-ink: #ffffff; --accent-bg: #dcebfb;
    --ok: #146c43; --ok-bg: #dcf0e4; --ok-ink: #ffffff;
    --warn: #8a580c; --warn-bg: #f7e3c2;
    --err: #b3382e; --err-bg: #f9e3e0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow-x: clip; }
  body { margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--ink); display: flex; font-size: var(--text-dense); line-height: 1.5; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  html { scrollbar-color: var(--rule) transparent; caret-color: var(--accent); }
  button { font: inherit; }
  svg.ic { width: 14px; height: 14px; flex: none; vertical-align: -2px; }
  code { font-family: var(--font-mono); }

  #sidebar { width: 320px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; background: var(--panel); min-height: 0; flex: none; }
  #sidebar header { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-4) var(--sp-4) var(--sp-1); }
  #sidebar h1 { font-size: var(--text-screen); margin: 0; font-weight: 600; }
  #inboxBtn { display: inline-flex; align-items: center; gap: var(--sp-2); background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--r-control); padding: var(--sp-2) var(--sp-3); cursor: pointer; min-height: 32px; font-size: var(--text-small); }
  #inboxBtn:hover { border-color: var(--accent); }
  #inboxBtn .count { font-variant-numeric: tabular-nums; font-weight: 600; }
  #inboxBtn.attn { border-color: var(--warn); color: var(--warn); }
  #policy { font-size: var(--text-label); color: var(--muted); margin: var(--sp-1) var(--sp-4) var(--sp-3); line-height: 1.5; font-variant-numeric: tabular-nums; }
  .connnote { font-size: var(--text-label); color: var(--err); margin: 0 var(--sp-4) var(--sp-3); line-height: 1.5; }
  #inboxPanel { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: var(--sp-2) var(--sp-4) var(--sp-3); background: var(--panel-2); }
  #inboxPanel h2 { font-size: var(--text-small); margin: var(--sp-2) 0 var(--sp-2); font-weight: 600; }
  .inboxItem { padding: var(--sp-2) 0; border-top: 1px solid var(--rule); }
  .inboxItem:first-of-type { border-top: 0; }
  .inboxItem .t { font-size: var(--text-small); }
  .inboxItem .r { font-size: var(--text-label); color: var(--warn); margin: var(--sp-1) 0 var(--sp-2); }
  .inboxItem button { background: none; border: 1px solid var(--rule); color: var(--ink); border-radius: var(--r-control); padding: var(--sp-1) var(--sp-3); cursor: pointer; min-height: 32px; margin-right: var(--sp-2); font-size: var(--text-small); }
  .inboxItem button:hover { border-color: var(--accent); }
  .inboxEmpty { color: var(--muted); font-size: var(--text-small); margin: var(--sp-1) 0; }

  #sessions { flex: 1; overflow-y: auto; padding-bottom: var(--sp-2); scrollbar-color: var(--rule) transparent; }
  .group { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--text-label); color: var(--muted); margin: var(--sp-4) var(--sp-4) var(--sp-1); font-weight: 600; }
  .gcount { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; background: var(--panel-2); border-radius: var(--r-chip); padding: 0 var(--sp-2); }
  .session { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--rule); cursor: pointer; }
  .session:hover { background: var(--panel-2); }
  .session.selected { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
  .session .task { font-size: var(--text-small); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .statusrow { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-1); font-size: var(--text-label); color: var(--muted); }
  .chip { display: inline-block; font-size: var(--text-label); padding: var(--sp-1) var(--sp-2); border-radius: var(--r-chip); line-height: 1.25; }
  .chip.working { background: var(--accent-bg); color: var(--accent); }
  .chip.needs-you { background: var(--warn-bg); color: var(--warn); }
  .chip.done { background: var(--ok-bg); color: var(--ok); }
  .tmode { border: 1px solid var(--rule); border-radius: var(--r-chip); padding: 0 var(--sp-2); line-height: 1.4; }
  .checkline { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-1); font-size: var(--text-label); color: var(--ok); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .checkline .cmd { font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; }
  .checkline.failed { color: var(--err); }
  .checkline.noted { color: var(--warn); }
  .checkbanner.noted { border-color: var(--warn); color: var(--warn); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  #composer { border-top: 1px solid var(--rule); padding: var(--sp-3) var(--sp-4); }
  #composer label { display: block; font-size: var(--text-label); color: var(--muted); margin: var(--sp-2) 0 var(--sp-1); }
  #composer label:first-child { margin-top: 0; }
  #composer input, #composer textarea, #composer select { width: 100%; background: var(--field); border: 1px solid var(--rule); border-radius: var(--r-control); color: var(--ink); padding: var(--sp-2); font: inherit; font-size: var(--text-small); }
  #composer button[type="submit"] { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--r-control); padding: var(--sp-2) var(--sp-4); cursor: pointer; margin-top: var(--sp-3); min-height: 36px; font-weight: 600; }
  #composer button[type="submit"]:hover { background: var(--accent-hover); }
  .err { color: var(--err); font-size: var(--text-label); margin: var(--sp-2) 0 0; }

  #settings { border-top: 1px solid var(--rule); padding: var(--sp-3) var(--sp-4); display: flex; align-items: center; justify-content: space-between; font-size: var(--text-label); color: var(--muted); }
  #themeBtn { display: inline-flex; align-items: center; gap: var(--sp-2); background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--r-control); padding: var(--sp-2) var(--sp-3); cursor: pointer; min-height: 32px; font-size: var(--text-small); }
  #themeBtn:hover { border-color: var(--accent); }

  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  #detail { padding: var(--sp-5) var(--sp-5); overflow-y: auto; flex: 1; scrollbar-color: var(--rule) transparent; }
  #detail h2 { font-size: var(--text-title); margin: 0 0 var(--sp-1); font-weight: 600; line-height: 1.25; }
  .meta { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-5); color: var(--muted); font-size: var(--text-label); font-variant-numeric: tabular-nums; }
  .meta .k { color: var(--faint); margin-right: var(--sp-1); }
  .chain { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); color: var(--muted); font-size: var(--text-label); margin-top: var(--sp-1); }
  .checkbanner { display: flex; gap: var(--sp-2); align-items: baseline; border: 1px solid var(--rule); border-radius: var(--r-card); padding: var(--sp-3) var(--sp-4); margin: var(--sp-4) 0 var(--sp-2); background: var(--field); }
  .checkbanner .v { font-weight: 600; }
  .checkbanner.pass .v { color: var(--ok); }
  .checkbanner.fail .v { color: var(--err); }
  .checkbanner code { color: var(--muted); font-size: var(--text-label); }
  pre { background: var(--field); border: 1px solid var(--rule); border-radius: var(--r-card); padding: var(--sp-3); font-family: var(--font-mono); font-size: var(--text-label); line-height: 1.5; overflow-x: auto; white-space: pre-wrap; margin: 0; }
  .label { font-size: var(--text-label); color: var(--muted); margin: var(--sp-5) 0 var(--sp-2); font-weight: 600; }
  .empty { color: var(--muted); margin: auto; font-size: var(--text-dense); padding: var(--sp-5); }
  .actions { margin-top: var(--sp-4); display: flex; gap: var(--sp-2); flex-wrap: wrap; }
  .actions button { border: 0; border-radius: var(--r-control); padding: var(--sp-2) var(--sp-4); cursor: pointer; min-height: 36px; font-weight: 600; display: inline-flex; align-items: center; gap: var(--sp-2); }
  .mergebtn { background: var(--ok); color: var(--ok-ink); }
  .retrybtn { background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule); }
  .retrybtn:hover { border-color: var(--accent); }
  .stopbtn { background: none; color: var(--err); border: 1px solid var(--err); }
  #detail textarea { width: 100%; background: var(--field); border: 1px solid var(--rule); border-radius: var(--r-control); color: var(--ink); padding: var(--sp-2); font: inherit; font-size: var(--text-small); }
  .hint { color: var(--muted); font-size: var(--text-label); margin: var(--sp-2) 0 0; line-height: 1.5; }
  .backbtn { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
    .dot.live { animation: none; }
  }
  @media (max-width: 768px) {
    html, body { height: auto; }
    body { flex-direction: column; min-height: 100vh; }
    #sidebar { width: 100%; border-right: 0; border-bottom: 1px solid var(--rule); }
    #sessions { max-height: 38vh; }
    #main { flex: none; height: 100vh; }
    #detail { padding: var(--sp-4); }
    .backbtn { display: inline-flex; align-items: center; gap: var(--sp-2); background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--r-control); padding: var(--sp-2) var(--sp-3); min-height: 44px; cursor: pointer; font-weight: 600; margin-bottom: var(--sp-3); }
    #inboxBtn, #themeBtn, .inboxItem button, .actions button, #composer button[type="submit"] { min-height: 44px; }
    #composer input, #composer select, #detail textarea { min-height: 44px; }
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-tray" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.1Z"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></symbol>
    <symbol id="i-merge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></symbol>
  </svg>

  <div id="sidebar">
    <header>
      <h1>Fleet</h1>
      <button id="inboxBtn" aria-label="Open the needs-you inbox">
        <svg class="ic"><use href="#i-tray"/></svg> Needs you <span class="count" id="inboxCount"></span>
      </button>
    </header>
    <p id="policy">Loading policy…</p>
    <p id="connNote" class="connnote" hidden>Cannot reach the server — retrying on its own.</p>
    <div id="inboxPanel" hidden>
      <h2>Needs you</h2>
      <div id="inboxItems"></div>
      <p id="inboxError" class="err" hidden></p>
    </div>
    <div id="sessions" role="list"><p class="empty">Loading the board…</p></div>
    <form id="composer">
      <label for="repo">Git repo path</label>
      <input id="repo" required autocomplete="off">
      <label for="project">Project (the policy picks its check)</label>
      <input id="project" value="fixture" autocomplete="off">
      <label for="agent">Agent</label>
      <select id="agent"><option value="">Default agent</option></select>
      <label for="task">Task</label>
      <textarea id="task" rows="2" placeholder="Hand out work…" required></textarea>
      <label for="check">Check command (optional)</label>
      <input id="check" autocomplete="off">
      <label for="next">Then (optional) — starts on its own when this one is verified done</label>
      <input id="next" autocomplete="off" placeholder="The next job in the chain">
      <button type="submit">Hand it out</button>
      <p class="err" id="formErr" hidden></p>
    </form>
    <div id="settings">
      <span>Settings</span>
      <button id="themeBtn" aria-label="Switch colour theme"></button>
    </div>
  </div>
  <div id="main"><div id="detail"><p class="empty">Pick a session, or hand out work below.</p></div></div>

<script>
const rootEl = document.documentElement;
function applyTheme(t) {
  rootEl.dataset.theme = t;
  const btn = document.getElementById('themeBtn');
  btn.innerHTML = t === 'dark'
    ? '<svg class="ic"><use href="#i-sun"/></svg> Light'
    : '<svg class="ic"><use href="#i-moon"/></svg> Dark';
}
applyTheme(localStorage.getItem('fleet-theme') || 'dark');
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = rootEl.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('fleet-theme', next);
  applyTheme(next);
});

let selected = null;
let inboxOpen = false;
let boardLoaded = false;
let boardErrShown = false;
const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
// On the phone layout the detail sits below the whole sidebar;
// selecting a session must bring it into view or the tap looks dead.
function revealDetail() {
  if (window.matchMedia('(max-width: 768px)').matches) {
    document.getElementById('main').scrollIntoView();
  }
}

async function refresh() {
  let pol, sessions, inbox;
  try {
    pol = await (await fetch('/api/policy')).json();
    sessions = await (await fetch('/api/sessions')).json();
    inbox = await (await fetch('/api/inbox')).json();
  } catch (e) {
    // The board's error state: say what broke and what happens next,
    // and (before the first successful load) replace the loading
    // placeholder with it. A later poll failure keeps the last good
    // board on screen and only lights the note.
    document.getElementById('connNote').hidden = false;
    if (!boardLoaded && !boardErrShown) {
      boardErrShown = true;
      lastListKey = '__connerr';
      document.getElementById('policy').textContent = 'Policy unavailable — the server is not answering.';
      document.getElementById('sessions').innerHTML =
        '<p class="empty">The board cannot reach the server. Check that Fleet is running — it reconnects on its own.</p>';
    }
    return;
  }
  document.getElementById('connNote').hidden = true;
  boardLoaded = true;
  boardErrShown = false;
  const agentBits = (pol.agents || []).map(a => `${a.name} ${a.found ? 'found' : 'not found'}`).join(', ');
  const modelBit = pol.model ? ` Model for opencode sessions: ${pol.model}.` : '';
  const defaultBit = pol.default_agent
    ? `Default: ${pol.default_agent}${pol.default_agent_engine === 'custom' ? ' (custom command — test mode)' : ''}.`
    : 'Default: none.';
  document.getElementById('policy').textContent =
    `Agents: ${agentBits}. ${defaultBit}${modelBit} Up to ${pol.max_parallel} sessions run at once; an agent or check past ${pol.timeout_secs}s is handed back as needs-you; checks come from ${pol.source}.`;
  const sel = document.getElementById('agent');
  if (sel.options.length <= 1) {
    for (const a of (pol.agents || []).filter(a => a.found)) {
      const o = document.createElement('option'); o.value = a.name; o.textContent = a.name; sel.appendChild(o);
    }
  }
  const btn = document.getElementById('inboxBtn');
  document.getElementById('inboxCount').textContent = inbox.length;
  btn.classList.toggle('attn', inbox.length > 0);
  renderInbox(inbox);
  renderSessions(sessions);
  if (selected) {
    const s = sessions.find(x => x.id === selected);
    if (s) renderDetail(s);
  }
}

let lastListKey = '';
let lastDetailKey = '';
let detailError = '';

let lastInboxKey = '';
let inboxError = '';
const steerDrafts = {};
function renderInbox(inbox) {
  const panel = document.getElementById('inboxPanel');
  panel.hidden = !inboxOpen;
  if (!inboxOpen) { lastInboxKey = ''; return; }
  // Same discipline as the list and detail views: rebuilding on every
  // poll would destroy keyboard focus on the View/Retry buttons.
  const key = JSON.stringify([inbox.map(s => [s.id, s.reason]), inboxError]);
  if (key === lastInboxKey) return;
  lastInboxKey = key;
  const box = document.getElementById('inboxItems');
  const errEl = document.getElementById('inboxError');
  if (errEl) { errEl.textContent = inboxError; errEl.hidden = !inboxError; }
  box.innerHTML = '';
  if (!inbox.length) {
    box.innerHTML = '<p class="inboxEmpty">Nothing needs you right now.</p>';
    return;
  }
  for (const s of inbox) {
    const div = document.createElement('div');
    div.className = 'inboxItem';
    div.innerHTML = `<div class="t"></div><div class="r"></div>
      <button data-act="view">View</button><button data-act="retry">Retry</button>`;
    div.querySelector('.t').textContent = s.task;
    div.querySelector('.r').textContent = s.reason || 'needs you';
    div.querySelector('[data-act="view"]').onclick = () => { selected = s.id; detailError = ''; lastDetailKey = ''; inboxOpen = false; refresh(); revealDetail(); };
    div.querySelector('[data-act="retry"]').onclick = async () => {
      // A refused retry (409 — the session already moved on) must be
      // SEEN, not swallowed: post() reports the server's own words.
      inboxError = await post(`/api/sessions/${s.id}/retry`);
      lastInboxKey = '';
      refresh();
    };
    box.appendChild(div);
  }
}
document.getElementById('inboxBtn').addEventListener('click', () => { inboxOpen = !inboxOpen; refresh(); });

function statusChip(s) {
  if (s.bucket === 'working' && s.status === 'queued')
    return `<span class="chip working">queued #${s.queue_position ?? '?'}</span>`;
  return `<span class="chip ${s.bucket}">${s.status.replace('-', ' ')}</span>`;
}
function renderSessions(sessions) {
  // Skip the rebuild when nothing visible changed: rebuilding the
  // list every poll would drop keyboard focus from a row the operator
  // is tabbing through.
  const key = JSON.stringify(sessions.map(s => [s.id, s.status, s.bucket, s.check_passed, s.queue_position, s.test_mode, s.successor, (s.steer || []).length, s.id === selected]));
  if (key === lastListKey) return;
  lastListKey = key;
  const list = document.getElementById('sessions');
  list.innerHTML = '';
  if (!sessions.length) {
    list.innerHTML = '<p class="empty">No sessions yet. Hand out work below and it will run here.</p>';
    return;
  }
  const groups = [['needs-you', 'Needs you'], ['working', 'Working'], ['done', 'Done']];
  for (const [bucket, label] of groups) {
    const inGroup = sessions.filter(s => s.bucket === bucket);
    if (!inGroup.length) continue;
    const h = document.createElement('div');
    h.className = 'group';
    h.innerHTML = `<span></span><span class="gcount">${inGroup.length}</span>`;
    h.querySelector('span').textContent = label;
    list.appendChild(h);
    for (const s of inGroup) {
      const div = document.createElement('div');
      div.className = 'session' + (s.id === selected ? ' selected' : '');
      // Keyboard-operable: a session row is an action, not furniture.
      div.setAttribute('role', 'button');
      div.setAttribute('tabindex', '0');
      div.setAttribute('aria-label', `Open session: ${s.task}`);
      let inner = `<div class="task"></div><div class="statusrow">`;
      inner += (s.bucket === 'working' && s.status !== 'queued') ? '<span class="dot live"></span>' : '<span class="dot"></span>';
      inner += statusChip(s) + `<span>${esc(s.agent || '')}</span>${s.test_mode ? '<span class="tmode">test mode</span>' : ''}</div>`;
      if ((s.steer || []).length) inner += `<div class="checkline noted"><svg class="ic"><use href="#i-alert"/></svg><span>${s.steer.length} steering message${s.steer.length > 1 ? 's' : ''} waiting</span></div>`;
      if (s.check_passed === true) inner += (s.status === 'done' || s.status === 'merged')
        ? `<div class="checkline"><svg class="ic"><use href="#i-check"/></svg><span class="cmd"></span></div>`
        : `<div class="checkline noted"><svg class="ic"><use href="#i-alert"/></svg><span class="cmd"></span></div>`;
      if (s.check_passed === false) inner += `<div class="checkline failed"><svg class="ic"><use href="#i-x"/></svg><span class="cmd"></span></div>`;
      div.innerHTML = inner;
      div.querySelector('.task').textContent = s.task;
      const cl = div.querySelector('.checkline .cmd');
      if (cl) cl.textContent = s.check_cmd;
      div.onclick = () => { selected = s.id; detailError = ''; lastDetailKey = ''; refresh(); revealDetail(); };
      div.onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); div.onclick(); }
      };
      list.appendChild(div);
    }
  }
}

function renderDetail(s) {
  const d = document.getElementById('detail');
  // Rebuilding the detail DOM on every 2s poll destroys the scroll
  // position, keyboard focus, and any error the operator is reading.
  // Render only when the session's visible state actually changed;
  // when a render does happen, put scroll and focus back.
  const key = JSON.stringify([s.id, s.status, s.check_passed, s.reason, s.queue_position,
    s.transcript.length, s.transcript[s.transcript.length - 1] || '',
    (s.check_output || '').length, (s.check_output || '').slice(-80),
    (s.diff || '').length, (s.diff || '').slice(-80), detailError,
    (s.steer || []).length, s.successor, s.spawned_from, (s.next_queue || []).join('|'), s.test_mode]);
  if (key === lastDetailKey) return;
  const prevScroll = d.scrollTop;
  const prevTr = d.querySelector('#tr');
  const prevTrScroll = prevTr ? prevTr.scrollTop : 0;
  const prevTrAtBottom = prevTr ? (prevTr.scrollHeight - prevTr.scrollTop - prevTr.clientHeight < 24) : true;
  const activeId = (document.activeElement && d.contains(document.activeElement)) ? document.activeElement.id : '';
  lastDetailKey = key;
  const facts = [];
  facts.push(`<span class="fact"><span class="k">Branch</span><code>${esc(s.branch)}</code></span>`);
  facts.push(`<span class="fact"><span class="k">Agent</span>${esc(s.agent || 'unknown')}${s.test_mode ? ' (custom command — test mode)' : ''}</span>`);
  facts.push(`<span class="fact"><span class="k">Status</span>${esc(s.status)}</span>`);
  if (s.queue_position) facts.push(`<span class="fact"><span class="k">Queue</span>#${s.queue_position}</span>`);
  const chainBits = [];
  if (s.spawned_from) chainBits.push(`handed out automatically when ${s.spawned_from} finished`);
  if (s.successor) chainBits.push(`its finish handed out ${s.successor}`);
  if ((s.next_queue || []).length) chainBits.push(`then: ${s.next_queue.join(', ')}`);
  let html = `<button class="backbtn" id="backBtn"><svg class="ic"><use href="#i-back"/></svg> Back to the board</button><h2></h2><div class="meta">${facts.join('')}</div>`;
  if (chainBits.length) html += `<div class="chain">${chainBits.map(b => `<span>${esc(b)}</span>`).join('')}</div>`;
  if (s.check_passed !== undefined && s.check_passed !== null) {
    // "Verified done" is a claim about the SESSION, not just the
    // check: a session the gates refused (status needs-you) whose
    // check happened to pass must not wear it.
    const verified = s.check_passed && (s.status === 'done' || s.status === 'merged');
    const noted = s.check_passed && !verified;
    html += `<div class="checkbanner ${verified ? 'pass' : noted ? 'noted' : 'fail'}">
      <svg class="ic"><use href="#${verified ? 'i-check' : noted ? 'i-alert' : 'i-x'}"/></svg>
      <span class="v">${verified ? 'Check passed — verified done' : noted ? 'Check passed — but this session needs you' : 'Check failed'}</span>
      <code></code></div>`;
  }
  if (s.status === 'needs-you' && s.reason) html += `<div class="checkbanner fail reasonbanner"><svg class="ic"><use href="#i-alert"/></svg><span class="v"></span></div>`;
  html += `<div class="label">Transcript</div><pre id="tr"></pre>`;
  if (s.check_output) html += `<div class="label">Check output</div><pre id="co"></pre>`;
  if (s.diff) html += `<div class="label">Diff</div><pre id="df"></pre>`;
  html += `<div class="actions">`;
  if (s.status === 'done') html += `<button class="mergebtn" id="mergeBtn"><svg class="ic"><use href="#i-merge"/></svg> Merge this work</button>`;
  if (s.status === 'needs-you') html += `<button class="retrybtn" id="retryBtn"><svg class="ic"><use href="#i-retry"/></svg> Retry this session</button>`;
  if (s.status === 'queued' || s.status === 'working' || s.status === 'checking')
    html += `<button class="stopbtn" id="stopBtn"><svg class="ic"><use href="#i-stop"/></svg> Stop this session</button>`;
  html += `</div>`;
  if (s.status !== 'merged') {
    const hint = s.status === 'needs-you'
      ? 'Sending also retries the session — your message goes to the agent first, before anything is re-checked.'
      : s.status === 'done'
        ? 'Sending reopens this session: the agent gets your message and the work is re-checked before it can be merged.'
        : 'Delivered when the current run ends — before anything is committed or checked.';
    html += `<div class="label">Steer this session</div>
      <textarea id="steerText" rows="2" placeholder="Tell the agent what to change…"></textarea>
      <div class="actions"><button class="retrybtn" id="steerBtn"><svg class="ic"><use href="#i-send"/></svg> Send to the agent</button></div>
      <p class="hint">${hint}</p>`;
  }
  html += `<p class="err" id="actErr" hidden></p>`;
  d.innerHTML = html;
  d.querySelector('h2').textContent = s.task;
  const bb = d.querySelector('#backBtn');
  if (bb) bb.onclick = () => { document.getElementById('sidebar').scrollIntoView(); };
  const code = d.querySelector('.checkbanner code');
  if (code) code.textContent = s.check_cmd;
  const reasonEl = d.querySelector('.reasonbanner .v');
  if (reasonEl && s.status === 'needs-you') reasonEl.textContent = s.reason;
  d.querySelector('#tr').textContent = s.transcript.join('\n');
  if (d.querySelector('#co')) d.querySelector('#co').textContent = s.check_output || '';
  if (d.querySelector('#df')) d.querySelector('#df').textContent = s.diff;
  // The action error lives in detailError, outside the DOM, so a
  // re-render can never erase it before it is read.
  const errEl = d.querySelector('#actErr');
  if (errEl && detailError) { errEl.textContent = detailError; errEl.hidden = false; }
  const mb = d.querySelector('#mergeBtn');
  if (mb) mb.onclick = async () => {
    const r = await post(`/api/sessions/${s.id}/merge`);
    detailError = r || '';
    refresh();
  };
  const rb = d.querySelector('#retryBtn');
  if (rb) rb.onclick = async () => {
    const r = await post(`/api/sessions/${s.id}/retry`);
    detailError = r || '';
    refresh();
  };
  const tb = d.querySelector('#stopBtn');
  if (tb) tb.onclick = async () => {
    const r = await post(`/api/sessions/${s.id}/stop`);
    detailError = r || '';
    refresh();
  };
  // The steer draft lives outside the DOM (like detailError): a
  // re-render on the 2s poll must never eat a half-typed message.
  const st = d.querySelector('#steerText');
  if (st) {
    st.value = steerDrafts[s.id] || '';
    st.addEventListener('input', () => { steerDrafts[s.id] = st.value; });
  }
  const sb = d.querySelector('#steerBtn');
  if (sb) sb.onclick = async () => {
    const msg = (steerDrafts[s.id] || '').trim();
    if (!msg) { detailError = 'Write the message first.'; lastDetailKey = ''; renderDetail(s); return; }
    const r = await postBody(`/api/sessions/${s.id}/steer`, { message: msg });
    if (!r) steerDrafts[s.id] = '';
    detailError = r || '';
    refresh();
  };
  // Restore what the rebuild disturbed.
  d.scrollTop = prevScroll;
  const tr = d.querySelector('#tr');
  if (tr) tr.scrollTop = prevTrAtBottom ? tr.scrollHeight : prevTrScroll;
  if (activeId) {
    const again = d.querySelector('#' + CSS.escape(activeId));
    if (again) again.focus();
  }
}
function showErr(sel, msg) {
  const el = document.querySelector(sel);
  if (el) { el.textContent = msg; el.hidden = !msg; }
}
async function post(url) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  if (!r.ok) { try { return (await r.json()).error || 'request failed'; } catch { return 'request failed'; } }
  return null;
}
async function postBody(url, obj) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });
  if (!r.ok) { try { return (await r.json()).error || 'request failed'; } catch { return 'request failed'; } }
  return null;
}
document.getElementById('composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  showErr('#formErr', '');
  const body = {
    repo: document.getElementById('repo').value,
    project: document.getElementById('project').value,
    task: document.getElementById('task').value,
    check: document.getElementById('check').value,
  };
  const next = document.getElementById('next').value.trim();
  if (next) body.next = next;
  const agent = document.getElementById('agent').value;
  if (agent) body.agent = agent;
  const r = await fetch('/api/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { showErr('#formErr', (await r.json()).error || 'could not hand out the task'); return; }
  const s = await r.json();
  selected = s.id;
  document.getElementById('task').value = '';
  document.getElementById('next').value = '';
  refresh();
  revealDetail();
});
refresh();
setInterval(refresh, 2000);
</script>
