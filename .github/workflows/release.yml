name: release

# Every push to main that carries a NEW version in plugin.json (and its CHANGELOG.md
# entry) runs backend tests + frontend build, packages the Antigravity plugin tarball
# & zip with SHA256SUMS, and publishes GitHub Release vX.Y.Z. Pushing tag vX.Y.Z
# does the same.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(node -e "console.log(JSON.parse(require('fs').readFileSync('plugin.json','utf8')).version)")"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin.json version $ver"; exit 1
          fi
          if gh release view "v$ver" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$ver already exists: nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          grep -qE "^## \[?$ver\]?( |$)" CHANGELOG.md || { echo "CHANGELOG.md has no entry for version $ver"; exit 1; }
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test sidecar backend
        run: cd sidecars/fleet_pane && npm test
      - name: Build sidecar UI and live-web preview
        run: |
          cd frontend
          npm ci
          npm run build:live-web
      - name: Smoke test atomic installer
        run: |
          ./install.sh --dest "${{ runner.temp }}/fleet-plugin-smoke"
          test -f "${{ runner.temp }}/fleet-plugin-smoke/plugin.json"
          test -f "${{ runner.temp }}/fleet-plugin-smoke/sidecars/fleet_pane/server_core.mjs"
          test -f "${{ runner.temp }}/fleet-plugin-smoke/sidecars/fleet_pane/dist/index.html"
      - name: Package plugin archives
        run: |
          ver="${{ needs.plan.outputs.version }}"
          stage="fleet-antigravity-plugin-v${ver}"
          mkdir -p dist "$stage"
          cp plugin.json install.sh README.md CHANGELOG.md "$stage/"
          cp -R assets skills rules "$stage/"
          mkdir -p "$stage/sidecars/fleet_pane"
          cp sidecars/fleet_pane/package.json sidecars/fleet_pane/sidecar.json \
             sidecars/fleet_pane/main.mjs sidecars/fleet_pane/server_core.mjs \
             sidecars/fleet_pane/channels.mjs sidecars/fleet_pane/git_probe.mjs \
             sidecars/fleet_pane/swarm_store.mjs "$stage/sidecars/fleet_pane/"
          cp -R sidecars/fleet_pane/dist "$stage/sidecars/fleet_pane/"
          test -f "$stage/sidecars/fleet_pane/server_core.mjs"
          node -e '
            const { spawn } = require("node:child_process");
            const path = require("node:path");
            const entry = path.resolve(process.argv[1]);
            const child = spawn(process.execPath, [entry, "--standalone", "--port", "0"], { stdio: ["ignore", "pipe", "pipe"] });
            let buf = "", errBuf = "";
            const timer = setTimeout(() => { child.kill("SIGKILL"); console.error("smoke timeout", errBuf); process.exit(1); }, 10000);
            child.stderr.on("data", (d) => { errBuf += d; });
            child.stdout.on("data", async (d) => {
              buf += d;
              const m = buf.match(/http:\/\/127\.0\.0\.1:(\d+)/);
              if (!m) return;
              try {
                const base = `http://127.0.0.1:${m[1]}`;
                const h = await fetch(`${base}/api/health`);
                const hj = await h.json();
                const s = await fetch(`${base}/api/swarms`);
                const sj = await s.json();
                if (!h.ok || !hj.ok || !s.ok || !Array.isArray(sj.swarms)) {
                  throw new Error(`bad smoke response: ${h.status} ${s.status}`);
                }
                clearTimeout(timer);
                child.kill("SIGTERM");
                process.exit(0);
              } catch (e) {
                clearTimeout(timer);
                child.kill("SIGKILL");
                console.error(e, errBuf);
                process.exit(1);
              }
            });
            child.on("exit", (code) => {
              if (code !== null && code !== 0) {
                clearTimeout(timer);
                console.error("smoke exited", code, errBuf);
                process.exit(code);
              }
            });
          ' "$stage/sidecars/fleet_pane/main.mjs"
          tar -czf "dist/${stage}.tar.gz" "$stage"
          zip -rq "dist/${stage}.zip" "$stage"
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          awk -v v="$ver" '$0 ~ "^## \\[?"v"\\]?( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || echo "Release $ver." > dist/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-plugin-dist
          path: dist/*

  release:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fleet-plugin-dist
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.plan.outputs.version }}"
          gh release create "v$ver" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Fleet v$ver" \
            --notes-file dist/notes.md \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
